<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Now Playing</title>
  <style>
    /* Dark theme styles */
    body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    h1 {
        color: #ffffff;
        text-align: center;
    }

    #track {
        font-size: 24px;
        margin: 20px;
        color: #bbb;
        text-align: center;
    }

    .container {
        background-color: #1f1f1f;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        text-align: center;
        width: 90%;
        max-width: 800px;
    }

    audio {
        margin-top: 20px;
        width: 100%;
        max-width: 600px;
        border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Now Playing</h1>
    <p id="track">Loading...</p>
    <audio controls autoplay>
        <source src="https://okweezradio.duckdns.org/radio.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>
  </div>

  <script>
    async function fetchTrack() {
      try {
        const response = await fetch("http://okweezradio.duckdns.org:5000/track");
        const data = await response.json();
        console.log(data); // Log the response data to check its structure
        if (data && data.artist && data.title) {
          document.getElementById("track").textContent = `${data.artist} - ${data.title}`;
        } else {
          document.getElementById("track").textContent = "Track information unavailable";
        }
      } catch (err) {
        document.getElementById("track").textContent = "Unable to load track info.";
        console.error("Error fetching track data:", err);
      }
    }

    fetchTrack();
    setInterval(fetchTrack, 10000); // update every 10 sec
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Now Playing - OkWeez Radio</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
    h1 {
      color: #1db954;
    }
    #track {
      font-size: 1.5em;
      margin-top: 10px;
    }
    audio {
      margin-top: 20px;
      width: 100%;
    }
    .disclaimer {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background-color: #1e1e1e;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.8em;
      color: #aaaaaa;
      max-width: 220px;
      line-height: 1.3em;
    }
  </style>
</head>
<body>
  <h1>Now Playing</h1>
  <p id="track">Loading...</p>

  <audio controls autoplay>
    <source src="https://okweezradio.duckdns.org/radio.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <script>
    async function fetchTrack() {
      try {
        const response = await fetch("http://okweezradio.duckdns.org:5000/track");
        const data = await response.json();
        document.getElementById("track").textContent = `${data.artist} - ${data.title}`;
      } catch (err) {
        document.getElementById("track").textContent = "Unable to load track info.";
        console.error(err);
      }
    }

    fetchTrack();
    setInterval(fetchTrack, 10000); // update every 10 sec
  </script>

  <div class="disclaimer">
    pls don’t sue me Weezer and Green Day — I’m just a fan and I own the CDs.
  </div>
</body>
</html>

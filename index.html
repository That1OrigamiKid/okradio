<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OkWeez Radio</title>
    <style>
        body { font-family: Arial, sans-serif; }
        #track { font-size: 20px; }
    </style>
</head>
<body>
    <h1>Welcome to OkWeez Radio</h1>
    <h2>Now Playing:</h2>
    <p id="track">Loading...</p>
    <audio controls autoplay>
        <source src="https://okweezradio.duckdns.org/radio.mp3" type="audio/mp3">
        Your browser does not support the audio element.
    </audio>

    <script>
        async function fetchTrack() {
            try {
                const response = await fetch('https://okweezradio.duckdns.org/track');
                const data = await response.text();
                document.getElementById('track').textContent = data || 'No track playing';
            } catch (err) {
                document.getElementById('track').textContent = 'Unable to load track info.';
            }
        }

        fetchTrack();
        setInterval(fetchTrack, 10000); // Update every 10 seconds
    </script>
</body>
</html>

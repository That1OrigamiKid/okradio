<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Now Playing</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .center-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
    }

    h1 {
      color: #1db954;
      margin-bottom: 10px;
    }

    #track {
      font-size: 1.5em;
      margin-bottom: 20px;
    }

    audio {
      width: 90%;
      max-width: 500px;
      margin-bottom: 30px;
    }

    .disclaimer {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 0.9em;
      color: #aaaaaa;
      background-color: #1e1e1e;
      padding: 10px 15px;
      border-radius: 8px;
      max-width: 250px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="center-content">
    <h1>Now Playing</h1>
    <p id="track">Loading...</p>

    <audio controls autoplay>
      <source src="https://okweezradio.duckdns.org/radio.mp3" type="audio/mp3">
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="disclaimer">
    pls don’t sue me Weezer and Green Day — I’m just a fan and I own the CDs.
  </div>

  <script>
    async function fetchTrack() {
      try {
        const response = await fetch("http://okweezradio.duckdns.org:5000/track");
        const data = await response.json();
        document.getElementById("track").textContent = `${data.artist} - ${data.title}`;
      } catch (err) {
        document.getElementById("track").textContent = "Unable to load track info.";
        console.error(err);
      }
    }

    fetchTrack();
    setInterval(fetchTrack, 10000);
  </script>
</body>
</html>
